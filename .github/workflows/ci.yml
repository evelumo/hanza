name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Dummy values so env validation and `next build` pass; nothing connects to them.
      DATABASE_URL: postgresql://hanza:hanza@localhost:5432/hanza
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-dummy-secret-do-not-use-in-production-0123456789
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm check:boundaries
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
