# The TLS front of the sandbox (`sandbox.sh tls`, README.md "A TLS front"): the shop as a real one is reached,
# https://<host>[:port] -> nginx, which ends TLS -> WordPress over HTTP with `X-Forwarded-Proto: https`.
# Included in nginx's `http` block (conf.d). Nothing here names a host: the certificate decides which names work.

# Whether a request carried a key, never the key itself.
map $http_authorization $sandbox_authorization {
  default      "other";
  ""           "none";
  "~*^basic "  "basic";
}

# One JSON object per request: the audit of what a client really sent. `uri` is the path with its query (a key in a
# URL would show here), `bytes` what went over the wire, `upstream_bytes` the body before compression.
log_format sandbox escape=json
  '{"time":"$time_iso8601","msec":$msec,"method":"$request_method","uri":"$request_uri","status":$status,'
  '"bytes":$body_bytes_sent,"upstream_bytes":"$upstream_response_length","gzip_ratio":"$gzip_ratio",'
  '"seconds":$request_time,"upstream_seconds":"$upstream_response_time","scheme":"$scheme","tls":"$ssl_protocol",'
  '"http":"$server_protocol","host":"$http_host","authorization":"$sandbox_authorization",'
  '"request_bytes":$request_length,"connection":$connection,"connection_requests":$connection_requests,'
  '"agent":"$http_user_agent"}';

access_log /dev/stdout sandbox;
access_log /var/log/sandbox/access.log sandbox;

# A shop that answers under "www." by sending the client to its own address, as most do.
server {
  listen 443 ssl;
  http2 on;
  server_name ~^www\.(?<bare>.+)$;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  # $http_host keeps the port the client used, which is the one this machine publishes ($bare has none).
  if ($http_host ~ "^www\.(?<bare_with_port>.+)$") {
    return 301 https://$bare_with_port$request_uri;
  }
  return 301 https://$bare$request_uri;
}

server {
  listen 443 ssl default_server;
  http2 on;
  server_name _;
  ssl_certificate /etc/nginx/tls/server.crt;
  ssl_certificate_key /etc/nginx/tls/server.key;
  ssl_protocols TLSv1.2 TLSv1.3;

  # Real shops compress. WordPress is asked for plain bodies (below), so the compression is nginx's and both
  # sizes are in the log.
  gzip on;
  gzip_types application/json text/plain text/css application/javascript;
  gzip_proxied any;
  gzip_min_length 256;
  gzip_vary on;

  client_max_body_size 16m;

  location / {
    # Docker's resolver, asked again at request time: the front keeps working when WordPress is stopped and
    # started (a new address), and answers 502 while it is away.
    resolver 127.0.0.11 valid=5s;
    set $shop http://wordpress:80;
    proxy_pass $shop;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Without the port: the shop calls itself by its host name alone.
    proxy_set_header Host $host;
    # Set here, so nothing a client sends decides whether WordPress believes the request came over TLS.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 120s;
  }
}
