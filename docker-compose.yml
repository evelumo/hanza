# Infrastructure for local development and self-hosting: Postgres + Redis.
name: hanza

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: hanza
      POSTGRES_PASSWORD: hanza
      POSTGRES_DB: hanza
    ports:
      - "${HANZA_POSTGRES_PORT:-5442}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hanza -d hanza"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    # BullMQ requires that keys are never evicted.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${HANZA_REDIS_PORT:-6389}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  redis-data:
